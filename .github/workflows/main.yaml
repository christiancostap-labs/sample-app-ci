name: GitOps Sync

on:
  pull_request:
    types:
      - closed
    branches:
      - main

jobs:
  gitops-sync:
    runs-on: arc-runner-set
    steps:
      - name: Install yq
        run: |
          sudo apt-get update
          sudo apt-get install -y yq
          
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get Configuration
        id: config
        run: |
          echo "gitops_repository=$(yq -r '.gitops.repository' config.yaml)" >> "$GITHUB_ENV"
          echo "gitops_targetBranch=$(yq -r '.gitops.targetBranch' config.yaml)" >> "$GITHUB_ENV"
          echo "gitops_repository=$(yq -r '.gitops.repository' config.yaml)"
          echo "gitops_targetBranch=$(yq -r '.gitops.targetBranch' config.yaml)"

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Checkout GitOps Repository
        uses: actions/checkout@v7
        with:
          repository: ${{ env.gitops_repository }}
          ref: ${{ env.gitops_targetBranch }}
          fetch-depth: 0

      - name: Sync Changes
        run: |
          git pull origin ${{ env.gitops_targetBranch }}
          git checkout -b feat/auto-sync-${{ env.gitops_targetBranch }}-${{ github.sha }}
          sed -i "s|repository:.*|repository: ghcr.io/${{ github.repository }}|g" charts/values.yaml
          sed -i "s|tag:.*|tag: ${{ github.sha }}|g" charts/values.yaml
          git add .
          git commit -m "Auto-sync: Update image repository and tag"
          git push origin feat/auto-sync-${{ env.gitops_targetBranch }}-${{ github.sha }}